<!-- Shared card framing keeps each governance domain visually consistent. -->
<section
  class="governance-card"
  [class.warning]="tone === 'warning'"
  [class.critical]="tone === 'critical'">
  <header class="card-heading">
    <div>
      <h2>{{ title }}</h2>
      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
  </header>
  <div class="card-content">
    @if (loading && !loaded) {
      <div class="card-loading" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Loading this section…</span>
      </div>
    } @else {
      @if (loading) {
        <div class="card-refreshing" role="status" aria-live="polite">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span>Updating…</span>
        </div>
      }
      <ng-content></ng-content>
    }
  </div>
</section>
