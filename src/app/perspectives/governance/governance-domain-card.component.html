<!-- Shared card framing keeps each governance domain visually consistent. -->
<section
  class="governance-card"
  [class.warning]="tone === 'warning'"
  [class.critical]="tone === 'critical'">
  <header class="card-heading">
    <div>
      <h2>{{ title }}</h2>
      @if (subtitle) {
        <p>{{ subtitle }}</p>
      }
    </div>
  </header>
  <div class="card-content">
    <ng-content></ng-content>
  </div>
</section>
