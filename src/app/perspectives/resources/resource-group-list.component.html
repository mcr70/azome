<div class="resource-group-container" style="padding: 15px; border: 1px solid #ccc; border-radius: 4px;">
  <h2>Azure Resource Groups</h2>

  <div *ngIf="loading">Loading resource groups...</div>
  <div *ngIf="error" style="color: red;">Error: {{ error }}</div>

  <ul *ngIf="resourceGroups.length > 0">
    <li *ngFor="let resourceGroup of resourceGroups" style="margin-bottom: 8px;">
      <strong>{{ resourceGroup.name }}</strong> - <small>Location: {{ resourceGroup.location }} ({{ resourceGroup.properties?.provisioningState }})</small>
    </li>
  </ul>

  <div *ngIf="!loading && resourceGroups.length === 0 && !error">
    No resource groups found or subscription empty.
  </div>
</div>
