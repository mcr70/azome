<section class="monitoring-perspective" aria-labelledby="monitoring-title">
  <div class="perspective-heading">
    <div>
      <p class="eyebrow">Perspective</p>
      <h1 id="monitoring-title">Monitoring</h1>
      <p class="description">Review subscription activity and Log Analytics workspaces.</p>
    </div>
    <button
      class="refresh-button"
      type="button"
      (click)="loadMonitoringData()"
      [disabled]="loading">
      Refresh
    </button>
  </div>

  <div class="monitoring-tabs" role="tablist" aria-label="Monitoring views">
    <button
      id="activity-tab"
      type="button"
      role="tab"
      [attr.aria-selected]="activeTab === 'activity'"
      [attr.aria-controls]="'activity-panel'"
      [class.active]="activeTab === 'activity'"
      (click)="activeTab = 'activity'">
      Activity log
    </button>
    <button
      id="log-analytics-tab"
      type="button"
      role="tab"
      [attr.aria-selected]="activeTab === 'log-analytics'"
      [attr.aria-controls]="'log-analytics-panel'"
      [class.active]="activeTab === 'log-analytics'"
      (click)="activeTab = 'log-analytics'">
      Log Analytics
    </button>
  </div>

  @if (loading) {
    <p class="status-message">Loading monitoring data...</p>
  }
  @if (error) {
    <div class="error-message" role="alert">{{ error }}</div>
  }

  <section
    id="activity-panel"
    class="monitoring-section"
    role="tabpanel"
    aria-labelledby="activity-tab"
    [hidden]="activeTab !== 'activity'">
    @if (!loading && !error) {
      <app-activity-log [events]="activityEvents"></app-activity-log>
    }
  </section>

  <section
    id="log-analytics-panel"
    class="monitoring-section"
    role="tabpanel"
    aria-labelledby="log-analytics-tab"
    [hidden]="activeTab !== 'log-analytics'">
    @if (!loading && !error) {
      <app-log-analytics [workspaces]="workspaces"></app-log-analytics>
    }
  </section>
</section>
