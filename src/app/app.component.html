@if (auth.isAuthenticated$ | async) {
  <header class="app-toolbar">
    <div class="toolbar-start">
      <strong class="app-name">Azome UI</strong>
      <label class="perspective-picker">
        <span>Perspective</span>
        <select [value]="selectedPerspective" (change)="changePerspective($event)" aria-label="Select perspective">
          <option value="resources">Resources</option>
          <option value="networking">Networking</option>
          <option value="monitoring">Monitoring</option>
          <option value="data">Data</option>
        </select>
      </label>
    </div>
    <div class="toolbar-end">
      <span class="user-details">{{ userName || 'Loading...' }} ({{ activeUserEmail }})</span>
      <button (click)="auth.logout()" class="sign-out-button">Sign Out</button>
    </div>
  </header>
}

<main class="app-content">
  <router-outlet></router-outlet>
</main>
