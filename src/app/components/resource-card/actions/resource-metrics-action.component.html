  title="View metrics"
  (click)="onClick($event)">
  <svg
    viewBox="0 0 24 24"
    width="18"
    height="18"

      d="M3 3v18h18M19 9l-5 5-4-4-3 3"
      fill="none"
      stroke="currentColor"

      stroke-linejoin="round"

</a>
