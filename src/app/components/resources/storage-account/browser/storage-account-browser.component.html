<section class="browser">
  <nav class="service-tabs" role="tablist" aria-label="Storage services">
    @for (tab of ['blobs', 'files', 'queues', 'tables']; track tab) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeService === tab"
        [class.active]="activeService === tab"
        (click)="selectService($any(tab))">
        {{ tab | titlecase }}
      </button>
    }
  </nav>

  @if (activeService === 'blobs') {
    <app-blob-browser
      [resourceId]="resourceId">
    </app-blob-browser>
  }
  @if (activeService === 'files') {
    <app-file-browser
      [resourceId]="resourceId">
    </app-file-browser>
  }
  @if (activeService === 'queues') {
    <app-queue-browser
      [resourceId]="resourceId">
    </app-queue-browser>
  }
  @if (activeService === 'tables') {
    <app-table-browser
      [resourceId]="resourceId">
    </app-table-browser>
  }
</section>
