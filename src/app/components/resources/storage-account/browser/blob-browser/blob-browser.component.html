<section class="storage-browser">
  <div class="toolbar" *ngIf="containers.length > 0">
    <label>
      Container
      <select [value]="container" (change)="selectContainer($any($event.target).value)">
        <option *ngFor="let item of containers" [value]="item.name">
          {{ item.name }}
        </option>
      </select>
    </label>
  </div>

  <p class="empty-state" *ngIf="!loading && !error && containers.length === 0">
    No containers found.
  </p>

  <nav class="crumbs" *ngIf="container">
    <button
      *ngFor="let crumb of crumbs; let last = last"
      type="button"
      [disabled]="last"
      (click)="navigate(crumb.prefix)">
      {{ crumb.label }}
    </button>
  </nav>

  <p class="state" *ngIf="loading">Loading…</p>
  <p class="error" role="alert" *ngIf="error">{{ error }}</p>

  <table *ngIf="container">
    <thead>
      <tr>
        <th>
          Name
        </th>
        <th>
          Size
        </th>
        <th>
          Content type
        </th>
        <th>
          Modified
        </th>
        <th>
          Actions
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>
          <button
            *ngIf="item.isDirectory"
            class="link"
            type="button"
            (click)="openFolder(item)">
            📁 {{ item.name }}
          </button>
          <button
            *ngIf="canPreview(item)"
            class="link"
            type="button"
            (click)="preview(item)">
            📄 {{ item.name }}
          </button>
          <span *ngIf="!item.isDirectory && !canPreview(item)">
            📄 {{ item.name }}
          </span>
        </td>
        <td>
          {{ item.isDirectory ? '—' : (item.size | number) }}
        </td>
        <td>
          {{ item.contentType || '—' }}
        </td>
        <td>
          {{ item.lastModified || '—' }}
        </td>
        <td class="actions">
          <button
            *ngIf="!item.isDirectory"
            type="button"
            title="Download"
            aria-label="Download"
            (click)="download(item)">
            ⬇
          </button>
        </td>
      </tr>
      <tr *ngIf="!loading && !error && items.length === 0">
        <td colspan="5">
          No blobs or folders found.
        </td>
      </tr>
    </tbody>
  </table>

  <aside class="preview" *ngIf="previewName">
    <button class="close" type="button" (click)="closePreview()">
      Close
    </button>
    <h3>
      {{ previewName }}
    </h3>
    <img *ngIf="previewUrl" [src]="previewUrl" [alt]="previewName">
    <pre *ngIf="previewText">{{ previewText }}</pre>
  </aside>
</section>
