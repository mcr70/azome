<section class="storage-browser">
  <div class="toolbar" *ngIf="queues.length > 0">
    <label>
      Queue
      <select [value]="queue" (change)="selectQueue($any($event.target).value)">
        <option *ngFor="let item of queues" [value]="item.name">
          {{ item.name }}
        </option>
      </select>
    </label>
    <label *ngIf="queue">
      Peek count
      <input type="number" min="1" max="32" [(ngModel)]="limit">
    </label>
    <button *ngIf="queue" type="button" (click)="peek()">
      Peek messages
    </button>
  </div>

  <p class="empty-state" *ngIf="!loading && !error && queues.length === 0">
    No queues found.
  </p>

  <p *ngIf="queue">Approximate message count: {{ count }}</p>
  <p class="state" *ngIf="loading">Loading…</p>
  <p class="error" role="alert" *ngIf="error">{{ error }}</p>

  <article *ngFor="let message of messages" class="message">
    <h3>Message {{ message.id }}</h3>
    <p>
      Inserted: {{ message.insertionTime || '—' }}
      · Expires: {{ message.expirationTime || '—' }}
    </p>
    <pre>{{ formatted(message.text) }}</pre>
  </article>

  <p *ngIf="queue && !loading && !error && messages.length === 0">
    No messages returned by peek.
  </p>
</section>
