<div class="resource-detail-host">

  <!-- Tab Navigation (Shown only if a custom component exists) -->
  @if (hasCustomComponent && showTabs) {
    <div class="detail-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'overview'"
        (click)="setTab('overview')">
        Formatted
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'json'"
        (click)="setTab('json')">
        JSON
      </button>
    </div>
  }

  <!-- Tab Content -->
  <div class="tab-content">

    <!-- has custom component -->
    @if (hasCustomComponent) {
      @if (activeTab === 'overview') {
        <ng-container *ngComponentOutlet="currentComponent; inputs: componentInputs"></ng-container>
      }
      @if (activeTab === 'json') {
        <div class="json-view">
          <pre>{{ resource | json }}</pre>
        </div>
      }
    }

    <!-- no custom component -->
    @if (!hasCustomComponent) {
      <div>
        Customized component not found for <strong>{{ resource?.type }}</strong>.
        Check the JSON view for details of this resource.
      </div>
    }

  </div>
</div>
