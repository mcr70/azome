<div *ngIf="!pinned" class="backdrop" (click)="close.emit()"></div>

<div
  class="panel-container"
  [class.panel-wide]="variant === 'wide'"
  [class.panel-content-sized]="variant === 'content'"
  role="dialog"
  aria-modal="true"
>
  <header class="panel-header">
    <div>
      <p class="resource-kind">{{ subtitle || 'Resource Details' }}</p>
      <h2>{{ title }}</h2>
    </div>
    <div class="panel-actions">
      <button *ngIf="showPanelActions" type="button" class="panel-action-button" [attr.aria-label]="pinned ? 'Unpin panel' : 'Pin panel'" [attr.title]="pinned ? 'Unpin panel' : 'Pin panel'" (click)="togglePin.emit()">
        {{ pinned ? '📌' : '📍' }}
      </button>
      <button type="button" class="close-button" (click)="close.emit()" aria-label="Close panel">&times;</button>
    </div>
  </header>

  <div class="panel-content">
    <ng-content></ng-content>
  </div>
</div>
